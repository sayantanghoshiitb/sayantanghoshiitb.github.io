name: Build and publish photography site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_birds:
        description: Refresh public eBird photos and country / state counts
        type: boolean
        default: false
  schedule:
    # Once a month: first day, 03:17 UTC (08:47 India time).
    - cron: '17 3 1 * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'schedule' || inputs.refresh_birds == true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh public eBird data
        # A failed endpoint keeps the last good snapshot; the warning is visible in Actions.
        continue-on-error: true
        run: python scripts/sync_public.py --photos
      - name: Save refreshed snapshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/birds.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Refresh monthly eBird snapshot"
            git push
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bird-snapshot
          path: data/birds.json
          retention-days: 1
  build:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: needs.refresh.result == 'success'
        with:
          name: bird-snapshot
          path: data
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build.py
      - run: python scripts/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
